<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Banner SEVNEL</title>

  <style>
    :root {
      --bg-1: #050507;
      --bg-2: #0b0711;
      --panel: #030305;

      --line: rgba(255, 255, 255, 0.10);
      --line-soft: rgba(255, 255, 255, 0.06);

      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.66);

      --purple: #b026ff;
      --purple-2: #d485ff;
      --cyan: #00e5ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;

      background: transparent;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 0;
      overflow: hidden;
    }

    .page {
      display: grid;
      grid-template-rows: 210px 255px;
      gap: 14px;

      width: 100%;
      min-height: 479px;
    }

    /* ========================================================= */
    /* BANNER SUPERIOR                                           */
    /* ========================================================= */

    .banner {
      position: relative;
      isolation: isolate;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(210px, 34%);

      width: 100%;
      height: 210px;
      overflow: hidden;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(176, 38, 255, 0.24),
          transparent 34%
        ),
        radial-gradient(
          circle at 90% 25%,
          rgba(0, 229, 255, 0.13),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          var(--bg-2) 0%,
          var(--bg-1) 48%,
          #010102 100%
        );

      border: 1px solid var(--line);
      border-radius: 22px;

      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .banner::before {
      content: "";

      position: absolute;
      inset: 0;
      z-index: -1;

      pointer-events: none;
      opacity: 0.18;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        );

      background-size: 34px 34px;

      mask-image:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.70),
          transparent 78%
        );
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;

      min-width: 0;
      padding: 28px 30px;
    }

    h1 {
      max-width: 780px;
      margin: 0;

      font-size: clamp(28px, 4.5vw, 48px);
      font-weight: 760;
      line-height: 1.02;
      letter-spacing: -0.045em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          90deg,
          #ffffff 0%,
          #d99cff 55%,
          #7ff3ff 100%
        );

      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      max-width: 680px;
      margin: 12px 0 0;

      color: var(--muted);

      font-size: clamp(13px, 1.55vw, 16px);
      line-height: 1.5;
    }

    .visual {
      position: relative;

      min-height: 210px;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      top: 50%;
      right: 8%;

      width: 180px;
      height: 180px;

      transform: translateY(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.42),
          transparent 10%
        ),
        radial-gradient(
          circle at 35% 35%,
          rgba(213, 111, 255, 0.90),
          transparent 26%
        ),
        radial-gradient(
          circle at 68% 65%,
          rgba(0, 229, 255, 0.78),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #51127a,
          #06070a 68%
        );

      box-shadow:
        0 0 70px rgba(176, 38, 255, 0.22),
        0 0 48px rgba(0, 229, 255, 0.12),
        inset -20px -24px 44px rgba(0, 0, 0, 0.46),
        inset 10px 10px 24px rgba(255, 255, 255, 0.10);

      animation:
        orbFloat 5.6s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";

      position: absolute;
      inset: -20px;

      border: 1px solid rgba(197, 107, 255, 0.28);
      border-radius: 50%;

      transform:
        rotateX(66deg)
        rotateZ(18deg);
    }

    .orb::after {
      inset: -40px;

      border-color: rgba(0, 229, 255, 0.18);

      transform:
        rotateX(72deg)
        rotateZ(-23deg);
    }

    @keyframes orbFloat {
      0%,
      100% {
        transform:
          translateY(-50%)
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-50%)
          translateY(-8px)
          rotate(2deg);
      }
    }

    /* ========================================================= */
    /* NÚCLEO OPERATIVO SEVNEL                                   */
    /* ========================================================= */

    .ai-section {
      position: relative;
      isolation: isolate;

      width: 100%;
      height: 255px;
      overflow: hidden;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(176, 38, 255, 0.16),
          transparent 24%
        ),
        radial-gradient(
          circle at 50% 40%,
          rgba(0, 229, 255, 0.08),
          transparent 36%
        ),
        linear-gradient(
          135deg,
          #09080f 0%,
          #030305 48%,
          #010102 100%
        );

      border: 1px solid var(--line);
      border-radius: 22px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .ai-section::before {
      content: "";

      position: absolute;
      inset: 0;
      z-index: -1;

      opacity: 0.14;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 82%
        );
    }

    .ai-section::after {
      content: "";

      position: absolute;
      top: 0;
      bottom: 0;
      left: -32%;

      width: 28%;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.035),
          rgba(176, 38, 255, 0.09),
          transparent
        );

      transform: skewX(-18deg);

      animation:
        sectionSweep 7s linear infinite;
    }

    @keyframes sectionSweep {
      100% {
        left: 115%;
      }
    }

    .animation-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* ========================================================= */
    /* LÍNEAS DE ENTRADA                                         */
    /* ========================================================= */

    .input-beam {
      position: absolute;
      top: 38%;
      left: 0;

      width: calc(50% - 65px);
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(176, 38, 255, 0.10) 12%,
          rgba(176, 38, 255, 0.50) 70%,
          rgba(213, 132, 255, 0.74) 100%
        );

      box-shadow:
        0 0 14px rgba(176, 38, 255, 0.20);
    }

    .input-beam::before,
    .input-beam::after {
      content: "";

      position: absolute;
      right: 0;

      width: 62%;
      height: 1px;

      transform-origin: right center;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(176, 38, 255, 0.36)
        );
    }

    .input-beam::before {
      transform: rotate(8deg);
    }

    .input-beam::after {
      transform: rotate(-8deg);
    }

    /* ========================================================= */
    /* PARTÍCULAS QUE ENTRAN                                     */
    /* ========================================================= */

    .particle {
      position: absolute;
      top: var(--top);
      left: -18px;

      width: var(--size);
      height: var(--size);

      opacity: 0;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #d99cff 34%,
          rgba(176, 38, 255, 0.22) 68%,
          transparent 72%
        );

      box-shadow:
        0 0 9px rgba(176, 38, 255, 0.70);

      animation:
        particleEnter var(--duration) linear infinite;

      animation-delay: var(--delay);
    }

    @keyframes particleEnter {
      0% {
        opacity: 0;
        transform:
          translateX(0)
          translateY(var(--offset))
          scale(0.45);
      }

      12% {
        opacity: 0.90;
      }

      82% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translateX(calc(50vw - 58px))
          translateY(0)
          scale(0.15);
      }
    }

    /* ========================================================= */
    /* NÚCLEO IA                                                 */
    /* ========================================================= */

    .nucleus-wrap {
      position: absolute;
      top: 37%;
      left: 50%;

      width: 132px;
      height: 132px;

      transform:
        translate(-50%, -50%);
    }

    .nucleus-glow {
      position: absolute;
      inset: -42px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(176, 38, 255, 0.18) 0%,
          rgba(0, 229, 255, 0.07) 32%,
          transparent 68%
        );

      filter: blur(10px);

      animation:
        glowPulse 2.8s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.60;
        transform: scale(0.92);
      }

      50% {
        opacity: 1;
        transform: scale(1.10);
      }
    }

    .ring {
      position: absolute;
      inset: 0;

      border: 1px solid rgba(213, 132, 255, 0.42);
      border-radius: 50%;

      box-shadow:
        0 0 18px rgba(176, 38, 255, 0.13);

      animation:
        ringRotate 10s linear infinite;
    }

    .ring::before,
    .ring::after {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      border-radius: 50%;
    }

    .ring::before {
      top: 9px;
      left: 26px;

      background: #d99cff;

      box-shadow:
        0 0 12px rgba(217, 156, 255, 0.90);
    }

    .ring::after {
      right: 12px;
      bottom: 28px;

      background: var(--cyan);

      box-shadow:
        0 0 12px rgba(0, 229, 255, 0.90);
    }

    .ring-two {
      inset: 13px;

      border-color: rgba(0, 229, 255, 0.26);

      animation:
        ringRotateReverse 7s linear infinite;
    }

    @keyframes ringRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ringRotateReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    .nucleus {
      position: absolute;
      inset: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 34% 28%,
          rgba(255, 255, 255, 0.80),
          transparent 7%
        ),
        radial-gradient(
          circle at 36% 38%,
          rgba(213, 132, 255, 0.94),
          transparent 32%
        ),
        radial-gradient(
          circle at 68% 68%,
          rgba(0, 229, 255, 0.82),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #4d126f,
          #030306 72%
        );

      box-shadow:
        0 0 34px rgba(176, 38, 255, 0.42),
        0 0 30px rgba(0, 229, 255, 0.20),
        inset -13px -15px 24px rgba(0, 0, 0, 0.58),
        inset 8px 8px 16px rgba(255, 255, 255, 0.10);

      animation:
        nucleusPulse 2.8s ease-in-out infinite;
    }

    .nucleus::before {
      content: "7";

      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 33px;
      height: 33px;

      color: #ffffff;

      font-size: 20px;
      font-weight: 700;
      line-height: 1;

      background: rgba(0, 0, 0, 0.58);

      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 9px;

      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .nucleus::after {
      content: "";

      position: absolute;
      inset: -40%;

      background:
        conic-gradient(
          transparent 0deg,
          rgba(255, 255, 255, 0.14) 40deg,
          transparent 85deg,
          rgba(0, 229, 255, 0.12) 160deg,
          transparent 220deg,
          rgba(176, 38, 255, 0.16) 290deg,
          transparent 360deg
        );

      animation:
        coreEnergy 5s linear infinite;
    }

    @keyframes nucleusPulse {
      0%,
      100% {
        transform: scale(0.97);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes coreEnergy {
      to {
        transform: rotate(360deg);
      }
    }

    /* ========================================================= */
    /* SALIDA DE ENERGÍA                                         */
    /* ========================================================= */

    .output-beam {
      position: absolute;
      top: 38%;
      right: 0;

      width: calc(50% - 65px);
      height: 1px;

      background:
        linear-gradient(
          90deg,
          rgba(0, 229, 255, 0.76) 0%,
          rgba(0, 229, 255, 0.42) 32%,
          rgba(0, 229, 255, 0.10) 78%,
          transparent 100%
        );

      box-shadow:
        0 0 14px rgba(0, 229, 255, 0.20);
    }

    .output-beam::before,
    .output-beam::after {
      content: "";

      position: absolute;
      left: 0;

      width: 62%;
      height: 1px;

      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          rgba(0, 229, 255, 0.38),
          transparent
        );
    }

    .output-beam::before {
      transform: rotate(8deg);
    }

    .output-beam::after {
      transform: rotate(-8deg);
    }

    /* ========================================================= */
    /* DESTELLOS DE SALIDA                                       */
    /* ========================================================= */

    .spark {
      position: absolute;
      top: var(--top);
      left: calc(50% + 52px);

      width: var(--width);
      height: 2px;

      opacity: 0;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.95),
          rgba(0, 229, 255, 0.78),
          transparent
        );

      box-shadow:
        0 0 9px rgba(0, 229, 255, 0.58);

      transform: rotate(var(--angle));

      animation:
        sparkExit var(--duration) linear infinite;

      animation-delay: var(--delay);
    }

    @keyframes sparkExit {
      0% {
        opacity: 0;
        transform:
          translateX(0)
          translateY(0)
          rotate(var(--angle))
          scaleX(0.35);
      }

      16% {
        opacity: 1;
      }

      72% {
        opacity: 0.88;
      }

      100% {
        opacity: 0;
        transform:
          translateX(44vw)
          translateY(var(--travel-y))
          rotate(var(--angle))
          scaleX(1.25);
      }
    }

    /* ========================================================= */
    /* MENSAJE PRINCIPAL                                         */
    /* ========================================================= */

    .message {
      position: absolute;
      right: 18px;
      bottom: 17px;
      left: 18px;
      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      pointer-events: none;
    }

    .message h2 {
      max-width: 820px;
      margin: 0;

      color: #ffffff;

      font-size: clamp(17px, 2vw, 25px);
      font-weight: 720;
      line-height: 1.18;
      letter-spacing: -0.025em;

      text-shadow:
        0 5px 22px rgba(0, 0, 0, 0.72);
    }

    .message h2 strong {
      color: transparent;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #d99cff 50%,
          #7ff3ff
        );

      background-clip: text;
      -webkit-background-clip: text;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 10px;
      padding: 7px 13px;

      color: rgba(255, 255, 255, 0.76);

      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      background:
        rgba(255, 255, 255, 0.045);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      border-radius: 999px;

      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 0 3px rgba(0, 229, 255, 0.08),
        0 0 12px rgba(0, 229, 255, 0.90);

      animation:
        statusPulse 1.7s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.72;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    /* ========================================================= */
    /* RESPONSIVE                                                */
    /* ========================================================= */

    @media (max-width: 720px) {
      .page {
        grid-template-rows: 220px 280px;
        min-height: 514px;
      }

      .banner {
        grid-template-columns: 1fr;
        height: 220px;
      }

      .content {
        position: relative;
        z-index: 2;

        padding: 24px 22px;
      }

      .visual {
        position: absolute;
        inset: 0 0 0 auto;

        width: 44%;
        min-height: 220px;

        opacity: 0.46;
      }

      .orb {
        right: -28%;

        width: 160px;
        height: 160px;
      }

      .subtitle {
        max-width: 82%;
      }

      .ai-section {
        height: 280px;
      }

      .nucleus-wrap {
        top: 36%;

        width: 116px;
        height: 116px;
      }

      .nucleus {
        inset: 23px;
      }

      .input-beam,
      .output-beam {
        top: 36%;
      }

      .message {
        bottom: 20px;
      }
    }

    @media (max-width: 480px) {
      .page {
        grid-template-rows: 230px 300px;
        min-height: 544px;
      }

      .banner {
        height: 230px;
      }

      .ai-section {
        height: 300px;
      }

      .content {
        padding: 22px 18px;
      }

      .subtitle {
        max-width: 100%;
      }

      .visual {
        width: 48%;
      }

      .message h2 {
        max-width: 94%;
        font-size: 17px;
      }

      .status {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      .ai-section::after,
      .particle,
      .spark,
      .nucleus-glow,
      .ring,
      .ring-two,
      .nucleus,
      .nucleus::after,
      .status-dot {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- ====================================================== -->
    <!-- BANNER SUPERIOR                                        -->
    <!-- ====================================================== -->

    <section class="banner" aria-label="Bienvenida a SEVNEL">
      <div class="content">
        <h1>
          <span id="greeting" class="gradient">Buenos días</span>,
          <span id="name">Equipo SEVNEL</span>
        </h1>

        <p class="subtitle">
          Aquí tienes el pulso de tu negocio en tiempo real. Revisa tus
          oportunidades, conversiones y resultados desde un solo lugar.
        </p>
      </div>

      <div class="visual" aria-hidden="true">
        <div class="orb"></div>
      </div>
    </section>

    <!-- ====================================================== -->
    <!-- NÚCLEO OPERATIVO SEVNEL                                -->
    <!-- ====================================================== -->

    <section
      class="ai-section"
      aria-label="SEVNEL AI operando"
    >
      <div class="animation-stage" aria-hidden="true">

        <div class="input-beam"></div>

        <!-- Partículas que entran desde la izquierda -->

        <span
          class="particle"
          style="
            --top: 18%;
            --size: 7px;
            --duration: 4.8s;
            --delay: -1.1s;
            --offset: 18px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 25%;
            --size: 5px;
            --duration: 5.6s;
            --delay: -3.2s;
            --offset: -10px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 31%;
            --size: 8px;
            --duration: 4.3s;
            --delay: -2.4s;
            --offset: 8px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 38%;
            --size: 5px;
            --duration: 5.2s;
            --delay: -4.5s;
            --offset: -5px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 44%;
            --size: 7px;
            --duration: 4.9s;
            --delay: -0.8s;
            --offset: 12px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 50%;
            --size: 4px;
            --duration: 5.8s;
            --delay: -2.9s;
            --offset: -12px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 56%;
            --size: 6px;
            --duration: 4.6s;
            --delay: -3.7s;
            --offset: 7px;
          "
        ></span>

        <span
          class="particle"
          style="
            --top: 62%;
            --size: 5px;
            --duration: 5.4s;
            --delay: -1.9s;
            --offset: -18px;
          "
        ></span>

        <!-- Núcleo central -->

        <div class="nucleus-wrap">
          <div class="nucleus-glow"></div>
          <div class="ring"></div>
          <div class="ring ring-two"></div>
          <div class="nucleus"></div>
        </div>

        <div class="output-beam"></div>

        <!-- Destellos que salen hacia la derecha -->

        <span
          class="spark"
          style="
            --top: 20%;
            --width: 30px;
            --angle: -6deg;

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(
        window.location.search
      );

      const rawName =
        params.get("nombre") || "Equipo SEVNEL";

      const name =
        rawName.trim() || "Equipo SEVNEL";

      const greetingElement =
        document.getElementById("greeting");

      const nameElement =
        document.getElementById("name");

      function updateGreeting() {
        const localHour =
          new Date().getHours();

        let greeting =
          "Buenas noches";

        if (
          localHour >= 5 &&
          localHour < 12
        ) {
          greeting =
            "Buenos días";
        } else if (
          localHour >= 12 &&
          localHour < 19
        ) {
          greeting =
            "Buenas tardes";
        }

        greetingElement.textContent =
          greeting;

        nameElement.textContent =
          name;
      }

      updateGreeting();

      window.setInterval(
        updateGreeting,
        60000
      );
    })();
  </script>
