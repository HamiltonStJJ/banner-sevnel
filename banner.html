<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Banner SEVNEL</title>

  <style>
    :root {
      --bg-1: #050507;
      --bg-2: #0b0711;
      --panel: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.66);
      --purple: #b026ff;
      --purple-2: #d485ff;
      --cyan: #00e5ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 0;
      overflow: hidden;
    }

    .banner {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(210px, 34%);
      width: 100%;
      min-height: 210px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(176, 38, 255, 0.24),
          transparent 34%
        ),
        radial-gradient(
          circle at 90% 25%,
          rgba(0, 229, 255, 0.13),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          var(--bg-2) 0%,
          var(--bg-1) 48%,
          #010102 100%
        );
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        );
      background-size: 34px 34px;
      mask-image:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.7),
          transparent 78%
        );
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: 28px 30px;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(28px, 4.5vw, 48px);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 760;
    }

    .gradient {
      color: transparent;
      background:
        linear-gradient(
          90deg,
          #ffffff 0%,
          #d99cff 55%,
          #7ff3ff 100%
        );
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      max-width: 680px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.55vw, 16px);
      line-height: 1.5;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.78);
      background: var(--panel);
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .visual {
      position: relative;
      min-height: 210px;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      top: 50%;
      right: 8%;
      width: 180px;
      height: 180px;
      transform: translateY(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.42),
          transparent 10%
        ),
        radial-gradient(
          circle at 35% 35%,
          rgba(213, 111, 255, 0.9),
          transparent 26%
        ),
        radial-gradient(
          circle at 68% 65%,
          rgba(0, 229, 255, 0.78),
          transparent 30%
        ),
        linear-gradient(145deg, #51127a, #06070a 68%);
      box-shadow:
        0 0 70px rgba(176, 38, 255, 0.22),
        0 0 48px rgba(0, 229, 255, 0.12),
        inset -20px -24px 44px rgba(0, 0, 0, 0.46),
        inset 10px 10px 24px rgba(255, 255, 255, 0.10);
      animation: float 5.6s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: -20px;
      border: 1px solid rgba(197, 107, 255, 0.28);
      border-radius: 50%;
      transform: rotateX(66deg) rotateZ(18deg);
    }

    .orb::after {
      inset: -40px;
      border-color: rgba(0, 229, 255, 0.18);
      transform: rotateX(72deg) rotateZ(-23deg);
    }

    .brand {
      position: absolute;
      right: 26px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(213, 111, 255, 0.42);
      border-radius: 10px;
      background:
        linear-gradient(
          145deg,
          rgba(176, 38, 255, 0.50),
          rgba(0, 0, 0, 0.80)
        );
      box-shadow: 0 0 18px rgba(176, 38, 255, 0.24);
      font-size: 16px;
      letter-spacing: 0;
    }

    @keyframes float {
      0%,
      100% {
        transform:
          translateY(-50%)
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-50%)
          translateY(-8px)
          rotate(2deg);
      }
    }

    @media (max-width: 720px) {
      .banner {
        grid-template-columns: 1fr;
        min-height: 220px;
      }

      .content {
        position: relative;
        z-index: 2;
        padding: 24px 22px;
      }

      .visual {
        position: absolute;
        inset: 0 0 0 auto;
        width: 44%;
        opacity: 0.46;
      }

      .orb {
        right: -28%;
        width: 160px;
        height: 160px;
      }

      .brand {
        display: none;
      }

      .subtitle {
        max-width: 82%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <section class="banner" aria-label="Bienvenida a SEVNEL">
    <div class="content">
      <h1>
        <span id="greeting" class="gradient">Buenos días</span>,
        <span id="name">Equipo SEVNEL</span>
      </h1>

      <p class="subtitle">
        Aquí tienes el pulso de tu negocio en tiempo real. Revisa tus
        oportunidades, conversiones y resultados desde un solo lugar.
      </p>

      <div class="meta">
        <span class="chip">
          📅
          <span id="date">—</span>
        </span>

        <span class="chip">
          🕒
          <span id="time">—</span>
        </span>
      </div>
    </div>

    <div class="visual" aria-hidden="true">
      <div class="orb"></div>

      <div class="brand">
        <span class="brand-mark">7</span>
        SEVNEL
      </div>
    </div>
  </section>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const name = params.get("nombre") || "Equipo SEVNEL";

      const greetingElement = document.getElementById("greeting");
      const nameElement = document.getElementById("name");
      const dateElement = document.getElementById("date");
      const timeElement = document.getElementById("time");

      function updateBanner() {
        /*
         * new Date() toma automáticamente la fecha y hora local
         * de la computadora o celular que está viendo el banner.
         */
        const now = new Date();
        const localHour = now.getHours();

        let greeting = "Buenas noches";

        if (localHour >= 5 && localHour < 12) {
          greeting = "Buenos días";
        } else if (localHour >= 12 && localHour < 19) {
          greeting = "Buenas tardes";
        }

        greetingElement.textContent = greeting;
        nameElement.textContent = name;

        dateElement.textContent = new Intl.DateTimeFormat("es", {
          weekday: "long",
          day: "numeric",
          month: "long"
        }).format(now);

        timeElement.textContent = new Intl.DateTimeFormat("es", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(now);
      }

      updateBanner();

      /*
       * Actualiza la hora cada 30 segundos.
       */
      window.setInterval(updateBanner, 30000);
    })();
  </script>
</body>
</html>
